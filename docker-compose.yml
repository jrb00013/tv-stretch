services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TV_STRETCH_DATABASE_URL=sqlite:////data/tv_stretch.db
      - TV_STRETCH_PUBLIC_BASE_URL=http://localhost:8000
      # Minimum confidence (0–1) for POST /presence/occupancy to trigger display handoff
      - TV_STRETCH_PRESENCE_HANDOFF_MIN_CONFIDENCE=0.65
    volumes:
      - tv_stretch_data:/data
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./server/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  tv_stretch_data:
